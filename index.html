<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b25"><title>Monsoon Traders</title><meta name="description" content="An original two-player port strategy game where the trade wind reverses every four voyages."><link rel="stylesheet" href="shared.css"><style>
body{--accent:#e9c377;background:radial-gradient(circle at 95% 4%,#536458 0,transparent 36%),radial-gradient(circle at 0% 70%,#224b54 0,transparent 42%),#101b25}.board{background:linear-gradient(135deg,#2b4e54,#1b3b44);border-radius:20px;border:1px solid #759089;padding:clamp(10px,2vw,23px);display:grid;grid-template-columns:minmax(54px,90px) repeat(6,minmax(0,1fr)) minmax(54px,90px);grid-template-rows:auto auto;gap:clamp(4px,1.1vw,12px);align-items:stretch;min-height:265px}.harbor{background:#17323d;border:2px solid #a88656;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:185px;grid-row:1/3}.harbor.left{grid-column:1}.harbor.right{grid-column:8}.harbor b{font:800 clamp(21px,4vw,38px) Outfit,sans-serif;color:var(--accent)}.harbor span{font-size:11px;color:var(--muted);text-align:center;padding:0 3px}.port{min-width:0;min-height:88px;padding:5px;border-radius:45%;background:radial-gradient(circle at 45% 30%,#517078,#234650);border:2px solid #a2a783;display:flex;flex-direction:column;justify-content:center;align-items:center}.port:disabled{opacity:1;cursor:default}.port.available{border-color:#ffd67b;box-shadow:0 0 0 3px #f3c26a44}.port.contract{background:radial-gradient(circle at 45% 30%,#83734b,#3c524d)}.port small{font-size:11px;color:#e9ddbb}.port strong{font:800 clamp(20px,3.2vw,34px) Outfit,sans-serif}.port em{font:700 11px Outfit,sans-serif;color:#ffe39b}.board-note{display:flex;justify-content:space-between;gap:12px;color:#c9d8d0;font-size:12px;padding:8px 5px}.market{display:flex;flex-wrap:wrap;gap:8px}.market .stat{flex:1;min-width:130px}.sail{font-size:30px;color:var(--accent)}
@media(max-width:740px){.board{grid-template-columns:42px repeat(6,minmax(0,1fr)) 42px;min-height:205px;padding:7px;gap:3px}.harbor{min-height:145px;border-radius:10px}.harbor span{font-size:9px;writing-mode:vertical-rl;max-height:100px;overflow:hidden}.port{min-height:65px;border-width:1px}.port small{display:none}.port em{font-size:9px}.board-note{font-size:11px}}
</style></head><body><main id="app"></main><script src="shared.js"></script><script src="game.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10222d">
  <title>Monsoon Traders</title>
  <meta name="description" content="Sail the fictional spice coast. Read the reversing wind, trade cargo across twelve ports, and outscore a rival merchant.">
  <link rel="stylesheet" href="shared.css">
  <style>
    body{--accent:#efc579;--south:#f2bd71;--north:#88d4ca;--water:#173e4e;background:radial-gradient(circle at 85% -10%,#4b655d 0,transparent 36%),radial-gradient(circle at 0 70%,#244a54 0,transparent 42%),#101b25}
    .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:5px 0 12px}
    .wind-status{display:flex;align-items:center;gap:10px;border:1px solid #82bdc0;background:#123544;border-radius:12px;padding:8px 13px;color:#e3fcf6;font-weight:700}
    .wind-status b{font:800 25px Outfit,sans-serif;color:#c4f4df}.wind-status small{display:block;color:#a9c9c7;font-size:11px;font-weight:500}
    .chart{position:relative;width:100%;aspect-ratio:1.57;min-height:450px;overflow:hidden;border:2px solid #6d8c83;border-radius:20px;background:#21485b;box-shadow:inset 0 0 45px #0b293cb0}
    .chart-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.chart-art .land{fill:#98a36caa;stroke:#d5d09c;stroke-width:4}.chart-art .shoal{fill:#8bc8af;opacity:.22}.chart-art .island{fill:#99a776ab;stroke:#d0c797;stroke-width:3}.chart-art .contour{fill:none;stroke:#a4c0b270;stroke-width:2}.chart-art .route{fill:none;stroke:#d3e5d699;stroke-width:4;stroke-dasharray:7 11}.chart-art .wind-flow{fill:none;stroke:#baf7e2;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 21;opacity:.65;animation:wind-flow 2.2s linear infinite}.chart.reverse .chart-art .wind-flow{animation-direction:reverse}
    .map-title{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 8px #103040;pointer-events:none;color:#e1e8ce;font:700 clamp(15px,2.3vw,25px) Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.75}.map-title small{display:block;font:600 11px 'DM Sans',sans-serif;letter-spacing:.15em;margin-top:4px;color:#b9d8c9}
    .port{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(62px,7.5vw,82px);height:clamp(62px,7.5vw,82px);padding:3px 5px;border:2px solid #d1a870;border-radius:16px;background:linear-gradient(155deg,#504331,#263f43);box-shadow:0 4px 12px #061d2c99;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;text-align:center;line-height:1.05;color:#fff3d5}
    .port.north{border-color:var(--north);background:linear-gradient(155deg,#3d696b,#24414c);color:#e9fffb}.port small{font:700 10px Outfit,sans-serif;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.port strong{font:800 clamp(20px,3.4vw,30px) Outfit,sans-serif;margin-top:2px}.port .port-no{position:absolute;top:-10px;left:-8px;min-width:19px;line-height:19px;border-radius:50%;background:#122e3b;color:#fff;font:700 10px Outfit,sans-serif}.port-badges{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);display:flex;gap:2px;white-space:nowrap}.port em{border-radius:100px;background:#ffd783;color:#26332e;padding:1px 5px;font:800 10px Outfit,sans-serif;white-space:nowrap;font-style:normal}.port.spice em:nth-child(2),.port.spice em:first-child:not(:last-child){background:#c9e8ab}.port.blocked{filter:saturate(.65)}.port.blocked em:last-child{background:#e6a69c}.port.guarded em:last-child{background:#bdd9f1}.port.available{box-shadow:0 0 0 4px #f9d17e75,0 5px 20px #061d2cba;border-color:#ffe0a1}.port.available:hover{transform:translate(-50%,-50%) scale(1.06);background:#75634b}.port:disabled{opacity:1;cursor:default}.port.contract{outline:2px solid #f6df96;outline-offset:3px}.port:focus-visible{outline:4px solid #fff;outline-offset:5px}
    .fleet{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(22px,3.2vw,32px);height:clamp(22px,3.2vw,32px);z-index:4;pointer-events:none;filter:drop-shadow(0 2px 2px #071d28)}.fleet svg{width:100%;height:100%;fill:var(--south)}.fleet.north svg{fill:var(--north)}.fleet.travel{z-index:8;width:38px;height:38px;transition:left .15s linear,top .15s linear;filter:drop-shadow(0 0 9px #fff9be)}
    .bank-gate{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:5;border:1px solid var(--south);border-radius:100px;background:#1a3944;color:#ffdfac;padding:3px 6px;font:800 9px Outfit,sans-serif;letter-spacing:.04em;pointer-events:none}.bank-gate.north{border-color:var(--north);color:#c9f5e8}
    .harbors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.harbor-card{border-radius:13px;padding:11px 15px;background:#273f47;border-left:5px solid var(--south);display:flex;justify-content:space-between;align-items:center;gap:10px}.harbor-card.north{border-color:var(--north)}.harbor-card b{font:800 27px Outfit,sans-serif}.harbor-card span{font-size:12px;color:#d0d9d2}.harbor-card strong{display:block;font:700 15px Outfit,sans-serif;color:#fff}
    .voyage-status{min-height:52px;background:#173e48;border-left:4px solid #dcb675;border-radius:7px;padding:10px 14px;margin:10px 0;color:#e6eee2;font-weight:700}.voyage-status strong{color:#ffe2a0}.map-legend{display:flex;gap:12px;flex-wrap:wrap;color:#bdcfc9;font-size:12px;margin:5px 0 13px}.map-legend span:before{content:'●';color:var(--south);margin-right:6px}.map-legend span:nth-child(2):before{color:var(--north)}.map-legend span:nth-child(3):before{color:#ffe194}.market{display:flex;flex-wrap:wrap;gap:9px}.market .stat{flex:1;min-width:155px}.ship-note{font-size:12px;color:#adc8c7}.skip{font-size:12px;padding:5px 10px;margin-left:auto}
    .turn-resource{padding:9px 15px;border:1px solid #7ca6a2;border-radius:12px;background:#1b4048;min-width:160px}.turn-resource b{display:block;color:#f6d697;font:800 23px Outfit,sans-serif}.turn-resource span{font-size:11px;color:#d1e6df}.orders-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 0 9px}.orders-head h3{margin:0}.orders-head .eyebrow{margin:0}.orders-head span{font-size:12px;color:#bed4d1}.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.order-card{text-align:left;min-height:98px;background:linear-gradient(130deg,#354e4b,#1d3542);border:1px solid #91a896;border-radius:12px;padding:12px;color:#f9f4df;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}.order-card strong,.order-card span,.order-card b{position:relative;z-index:1}.order-card i{position:absolute;right:10px;top:-14px;font:700 70px Outfit,sans-serif;color:#bddcc626;font-style:normal;pointer-events:none}.order-card.order-tailwind{background:linear-gradient(130deg,#395d62,#1b3747)}.order-card.order-tailwind i{color:#b6e8e044}.order-card.order-guard{background:linear-gradient(130deg,#3b5c56,#243d42)}.order-card strong{font:700 15px Outfit,sans-serif}.order-card span{font-size:12px;color:#e0e9df;line-height:1.3}.order-card b{margin-top:auto;color:#f3d18e;font-size:11px}.order-card:hover:not(:disabled),.order-card.selected{border-color:#ffe0a1;box-shadow:0 0 0 2px #ffe0a155}.order-card:disabled{opacity:.52;cursor:default}.cancel-order{margin:9px 0}.game-panel{background:linear-gradient(145deg,#1b333d,#152b36)}.myth-note{max-width:66ch;color:#cfddd1;font-size:14px;line-height:1.6;border-left:2px solid #b8c59b;padding-left:13px}
    .charter{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:10px 0 14px;padding:12px 16px;border-radius:12px;background:linear-gradient(95deg,#314c45,#1c3e46);border-left:4px solid #dec785}.charter .eyebrow{margin:0 0 3px}.charter h3{margin:0;font:700 18px Outfit,sans-serif;color:#fff4ce}.charter h3 span{font:700 12px 'DM Sans',sans-serif;color:#f8d384;margin-left:8px}.charter p{margin:3px 0 0;font-size:12px;color:#d9e6d8}.charter-progress{display:flex;gap:9px}.charter-progress div{min-width:78px;padding:7px 9px;border-radius:8px;background:#102e37a9}.charter-progress span{display:block;font-size:11px}.charter-progress .amber{color:var(--south)}.charter-progress .teal{color:var(--north)}.charter-progress strong{color:#fff;font:700 14px Outfit,sans-serif}.forecast-row{display:flex;align-items:stretch;gap:9px;margin-top:10px}.forecast{flex:1;min-height:50px;padding:10px 13px;border-radius:9px;background:#183943;color:#e4efdf;font-size:13px;line-height:1.5}.forecast-row button{min-width:150px}.forecast-row button[hidden]{display:none}.port.preview-source{box-shadow:0 0 0 5px #fff0ab,0 0 24px #ffe1a6;z-index:6}.port.preview-end{outline:4px solid #c1f3e0;outline-offset:5px;z-index:5}.epilogue{max-width:66ch;color:#d5e5db;line-height:1.6}
    @keyframes wind-flow{to{stroke-dashoffset:-96}}
    @media(max-width:740px){.chart{aspect-ratio:.84;min-height:480px}.port{width:48px;height:54px;border-radius:10px;padding:2px}.port small{font-size:8px}.port strong{font-size:19px}.port .port-no{left:-6px}.port em{font-size:8px;padding:1px 3px}.fleet{width:19px;height:19px}.fleet.travel{width:26px;height:26px}.map-title{font-size:15px;top:49%}.map-title small{font-size:8px}.harbor-card{padding:10px}.harbor-card strong{font-size:13px}.harbor-card b{font-size:23px}.orders{grid-template-columns:1fr}.order-card{min-height:70px}.orders-head{align-items:start;flex-direction:column}.charter{align-items:stretch;flex-direction:column}.charter-progress{justify-content:space-between}.charter-progress div{flex:1}.forecast-row{flex-direction:column}.forecast-row button{min-height:44px}}
    @media(prefers-reduced-motion:reduce){.chart-art .wind-flow{animation:none;stroke-dasharray:10 18}.fleet.travel,.port{transition:none!important}}
  </style>
</head>
<body><main id="app"></main><script src="shared.js"></script><script src="game.js"></script></body>
</html>
